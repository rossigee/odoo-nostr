---
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Validate version matches manifest
        run: |
          MANIFEST_VERSION=$(python -c "
          import ast
          with open('__manifest__.py', 'r') as f:
              manifest = ast.literal_eval(f.read())
          print(manifest['version'])
          ")

          if [ "${{ steps.version.outputs.version }}" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: Tag version (${{ steps.version.outputs.version }}) doesn't match manifest"
            exit 1
          fi

          echo "Version validation passed: $MANIFEST_VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi

          echo "## Changes in v${{ steps.version.outputs.version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$CHANGELOG" >> CHANGELOG.md

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create module package
        run: |
          mkdir -p release/nostr_manager

          rsync -av \
            --exclude='.git*' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='coverage.*' \
            --exclude='bandit-report.json' \
            --exclude='safety-report.json' \
            --exclude='.github' \
            ./ release/nostr_manager/

          cd release
          tar -czf nostr_manager-v${{ steps.version.outputs.version }}.tar.gz nostr_manager/
          zip -r nostr_manager-v${{ steps.version.outputs.version }}.zip nostr_manager/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nostr Manager v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha')
            || contains(steps.version.outputs.version, 'beta')
            || contains(steps.version.outputs.version, 'rc') }}
          files: |
            release/nostr_manager-v${{ steps.version.outputs.version }}.tar.gz
            release/nostr_manager-v${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to OCA/Odoo Community
        if: >
          !contains(steps.version.outputs.version, 'alpha')
          && !contains(steps.version.outputs.version, 'beta')
        run: |
          echo "Stable release v${{ steps.version.outputs.version }} created!"

  announce-release:
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create announcement template
        run: |
          cat > ANNOUNCEMENT.md << 'EOF'
          # Nostr Manager v${{ steps.version.outputs.version }} Released!

          We're excited to announce the release of Nostr Manager
          v${{ steps.version.outputs.version }} - a comprehensive Nostr
          client module for Odoo!

          ## Key Features

          - Secure Key Management: Generate and import Nostr keys
          - 2-Step Wizards: User-friendly key generation workflows
          - Relay Management: Manage 12+ default public relays
          - Partner Integration: Associate Nostr identities with contacts
          - Production Cryptography: secp256k1 and bech32 encoding

          ## Installation

          Download from GitHub releases.

          ## Links

          - GitHub: https://github.com/YOUR_ORG/nostr-manager
          - Issues: https://github.com/YOUR_ORG/nostr-manager/issues
          - Release: https://github.com/YOUR_ORG/nostr-manager/releases/tag/v${{ steps.version.outputs.version }}

          Built for the Nostr and Odoo communities
          EOF

          echo "Announcement template created"

      - name: Save announcement
        uses: actions/upload-artifact@v4
        with:
          name: release-announcement-v${{ steps.version.outputs.version }}
          path: ANNOUNCEMENT.md
