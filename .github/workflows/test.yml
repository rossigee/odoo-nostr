# yamllint disable rule:truthy
---
name: Odoo Module Tests

on:
  push:
    branches: [17.0, develop]
  pull_request:
    branches: [17.0]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: odoo
          POSTGRES_USER: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        odoo-version: ["17.0"]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          path: nostr_manager

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpq-dev \
            libxml2-dev \
            libxslt1-dev \
            libldap2-dev \
            libsasl2-dev \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libwebp-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libxcb1-dev

      - name: Checkout Odoo
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: ${{ matrix.odoo-version }}
          path: odoo
          depth: 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r odoo/requirements.txt
          pip install secp256k1 coincurve
          pip install coverage pytest-odoo

      - name: Prepare Odoo addons path
        run: |
          mkdir -p addons
          cp -r nostr_manager/nostr_manager addons/
          git clone --depth 1 https://github.com/rossigee/odoo-vault-connector.git /tmp/vault_tmp
          if [ -d "/tmp/vault_tmp/vault_connector" ]; then
            mv /tmp/vault_tmp/vault_connector addons/
          fi
          rm -rf /tmp/vault_tmp

      - name: Install module
        run: |
          cd odoo
          python odoo-bin -d test_db \
            --no-http \
            --stop-after-init \
            --addons-path="${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/odoo/addons" \
            --log-level=info \
            -i nostr_manager
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo

      - name: Run module tests
        run: |
          cd odoo
          coverage run --source="${GITHUB_WORKSPACE}/addons/nostr_manager" \
            odoo-bin -d test_db \
            --test-enable \
            --stop-after-init \
            --addons-path="${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/odoo/addons" \
            --log-level=test \
            -i nostr_manager
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo

      - name: Generate coverage report
        run: |
          cd odoo
          coverage report --include="../addons/nostr_manager/*"
          coverage xml --include="../addons/nostr_manager/*" -o coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./odoo/coverage.xml
          flags: unittests
          name: codecov-${{ matrix.odoo-version }}-py${{ matrix.python-version }}

      - name: Check module installability
        run: |
          cd odoo
          python odoo-bin -d test_db --update=nostr_manager \
            --stop-after-init --addons-path="${GITHUB_WORKSPACE}/addons,${GITHUB_WORKSPACE}/odoo/addons"
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo

      - name: Lint Python code
        run: |
          pip install flake8 black isort
          flake8 nostr_manager --max-line-length=88 --extend-ignore=E203,W503
          isort --check-only --diff nostr_manager
          black --check nostr_manager || echo "Code formatting could be improved"

      - name: Validate XML files
        run: |
          sudo apt-get install -y libxml2-utils
          find nostr_manager -name "*.xml" -exec xmllint --noout {} \; || exit 1

      - name: Security scan
        run: |
          pip install bandit safety
          bandit -r nostr_manager -f json -o bandit-report.json || true
          safety check --json --output safety-report.json || true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.odoo-version }}-py${{ matrix.python-version }}
          path: |
            odoo/coverage.xml
            bandit-report.json
            safety-report.json

  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Validate manifest
        run: |
          python3 << 'PYEOF'
          import ast
          import sys
          import os

          manifest_path = 'nostr_manager/__manifest__.py'
          if not os.path.exists(manifest_path):
              print(f'Error: {manifest_path} not found')
              sys.exit(1)

          with open(manifest_path, 'r') as f:
              content = f.read()

          try:
              manifest = ast.literal_eval(content)
              print('Manifest syntax is valid')

              required_fields = ['name', 'version', 'depends', 'data', 'installable']
              for field in required_fields:
                  if field not in manifest:
                      print(f'Missing required field: {field}')
                      sys.exit(1)

              print(f'Module: {manifest["name"]} v{manifest["version"]}')
              print(f'Dependencies: {manifest["depends"]}')
              print(f'Installable: {manifest["installable"]}')

          except Exception as e:
              print(f'Manifest validation failed: {e}')
              sys.exit(1)
          PYEOF

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit pbr

      - name: Run pre-commit
        run: |
          pre-commit install
          pre-commit run --all-files
